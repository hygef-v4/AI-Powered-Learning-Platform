name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Testcontainers dùng Docker có sẵn trên runner.
      - run: mvn -B verify
      - name: Require U04 and notification PostgreSQL tests without skips
        shell: pwsh
        run: ../scripts/assert-required-backend-tests.ps1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và đẩy image (tag theo SHA, không dùng latest)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for app in backend frontend; do
            docker build -t ghcr.io/$OWNER/platform-$app:${{ github.sha }} $app
            docker push ghcr.io/$OWNER/platform-$app:${{ github.sha }}
          done

  # Deploy: không có job ở đây. Nhà cung cấp VPS chặn kết nối quốc tế nên runner không SSH vào được; VPS tự hỏi
  # GitHub lần chạy thành công mới nhất của workflow này trên main rồi tự deploy, lỗi thì tự quay về
  # (infra/deploy/platform-deploy.sh, docs/runbooks/deploy-vps.md mục 10). Job images thành công thì workflow mới
  # thành công, nên image của SHA đó chắc chắn đã có trên GHCR.

  # Test script deploy bằng lệnh giả, không cần VPS.
  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck infra/deploy/platform-deploy.sh infra/deploy/test-platform-deploy.sh
      - run: bash infra/deploy/test-platform-deploy.sh
