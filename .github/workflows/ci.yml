name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Testcontainers dùng Docker có sẵn trên runner.
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và đẩy image (tag theo SHA, không dùng latest)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for app in backend frontend; do
            docker build -t ghcr.io/$OWNER/platform-$app:${{ github.sha }} $app
            docker push ghcr.io/$OWNER/platform-$app:${{ github.sha }}
          done

  # Deploy qua SSH: khung, chưa bật. Khi bật: ghi infra/.env từ secrets (quyền 600), đặt IMAGE_TAG=SHA,
  # rồi `docker compose pull && docker compose up -d` trên VPS (shared-infrastructure §5).
  deploy:
    if: false
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Chưa bật deploy"
