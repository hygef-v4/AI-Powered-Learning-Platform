openapi: 3.1.0
info:
  title: U06 - Rubric & Question Bank
  version: 1.0.0
  description: 'Ngân hàng câu hỏi và rubric theo phạm vi môn/lớp, có phiên bản bất biến. Question Bank không tạo rubric mới
    (rubric tạo khi soạn đề ở U09), chỉ sửa rubric đã có.


    Lỗi trả về dạng problem-details (`common.yaml`). `x-roles`: vai trò được gọi; quyền theo phạm vi (lớp, môn, chủ sở hữu)
    vẫn do backend kiểm.'
servers:
- url: /
security:
- cookieAuth: []
tags:
- name: U06 Rubric & Question Bank
  description: Ngân hàng câu hỏi và rubric theo phạm vi môn/lớp, có phiên bản bất biến.
paths:
  /api/v1/bank/items:
    get:
      operationId: searchBankItems
      summary: Tìm câu hỏi/rubric (bản ACTIVE mới nhất, cờ có bản nháp)
      x-roles: &id001
      - TEACHER
      - SUBJECT_MANAGER
      - ADMIN
      parameters:
      - name: scopeType
        in: query
        required: true
        schema:
          type: string
          enum:
          - SUBJECT
          - CLASS
      - name: scopeId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: itemType
        in: query
        required: false
        schema:
          type: string
          enum:
          - QUESTION
          - RUBRIC
      - name: assignmentType
        in: query
        required: false
        schema:
          type: string
          enum:
          - MULTIPLE_CHOICE_QUIZ
          - TEXT_ESSAY
          - DIAGRAM_ESSAY
          - CODE_LAB
          - GROUP_ASSIGNMENT
      - name: questionType
        in: query
        required: false
        schema:
          type: string
          enum: &id002
          - MCQ_SINGLE
          - MCQ_MULTI
          - ESSAY
          - DOCUMENT
          - CODE
      - name: difficulty
        in: query
        required: false
        schema:
          type: string
          enum:
          - EASY
          - MEDIUM
          - HARD
      - name: tag
        in: query
        required: false
        schema:
          type: string
      - name: moduleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          default: 50
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/PageMeta
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/BankItemSummary'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U06 Rubric & Question Bank
    post:
      operationId: createQuestion
      summary: Tạo câu hỏi nháp
      x-roles: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionInput'
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankItem'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U06 Rubric & Question Bank
  /api/v1/bank/items/{itemId}:
    get:
      operationId: getBankItem
      summary: Một phiên bản
      x-roles: *id001
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankItem'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U06 Rubric & Question Bank
    patch:
      operationId: updateBankItem
      summary: Sửa bản nháp hoặc tạo phiên bản mới (rubric)
      x-roles: *id001
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/QuestionInput'
              - type: object
                properties:
                  title:
                    type: string
                    maxLength: 200
                  criteria:
                    $ref: '#/components/schemas/RubricCriteria'
                required:
                - criteria
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankItem'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U06 Rubric & Question Bank
  /api/v1/bank/items/{itemId}/activate:
    post:
      operationId: activateBankItem
      summary: Kích hoạt
      description: 422 trả lỗi theo trường.
      x-roles: *id001
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankItem'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U06 Rubric & Question Bank
  /api/v1/bank/items/{itemId}/retire:
    post:
      operationId: retireBankItem
      summary: Ngưng dùng
      x-roles: *id001
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankItem'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U06 Rubric & Question Bank
  /api/v1/bank/items/{itemId}/clone:
    post:
      operationId: cloneBankItem
      summary: Nhân bản câu hỏi sang phạm vi khác
      x-roles: *id001
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scopeType:
                  type: string
                  enum:
                  - SUBJECT
                  - CLASS
                scopeId:
                  type: string
                  format: uuid
              required:
              - scopeType
              - scopeId
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankItem'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U06 Rubric & Question Bank
  /api/v1/bank/items/{lineageId}/versions:
    get:
      operationId: listVersions
      summary: Lịch sử phiên bản
      x-roles: *id001
      parameters:
      - name: lineageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankItemSummary'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U06 Rubric & Question Bank
  /api/v1/bank/items/{itemId}/preview:
    get:
      operationId: previewQuestion
      summary: Xem như người học
      x-roles: *id001
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: withAnswers
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionView'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U06 Rubric & Question Bank
  /api/v1/bank/import-templates/{type}:
    get:
      operationId: downloadImportTemplate
      summary: Tải file mẫu nhập
      x-roles: *id001
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Thành công
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U06 Rubric & Question Bank
  /api/v1/bank/imports:
    post:
      operationId: importQuestions
      summary: Nhập câu hỏi từ file
      x-roles: *id001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                scopeType:
                  type: string
                  enum:
                  - SUBJECT
                  - CLASS
                scopeId:
                  type: string
                  format: uuid
                questionType:
                  type: string
                  enum: *id002
                file:
                  type: string
                  format: binary
              required:
              - scopeType
              - scopeId
              - questionType
              - file
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdCount:
                    type: integer
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportRow'
                required:
                - createdCount
                - rows
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '413':
          $ref: ./common.yaml#/components/responses/PayloadTooLarge
      tags:
      - U06 Rubric & Question Bank
components:
  securitySchemes:
    cookieAuth:
      $ref: ./common.yaml#/components/securitySchemes/cookieAuth
  schemas:
    BankItemSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lineageId:
          type: string
          format: uuid
        version:
          type: integer
        itemType:
          type: string
          enum:
          - QUESTION
          - RUBRIC
        title:
          type: string
        questionType:
          type: string
          enum: *id002
        difficulty:
          type: string
          enum:
          - EASY
          - MEDIUM
          - HARD
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
        hasDraft:
          type: boolean
      required:
      - id
      - lineageId
      - version
      - itemType
      - title
      - status
      - hasDraft
    BankItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lineageId:
          type: string
          format: uuid
        version:
          type: integer
        itemType:
          type: string
          enum:
          - QUESTION
          - RUBRIC
        scopeType:
          type: string
          enum:
          - SUBJECT
          - CLASS
          - ASSIGNMENT
        scopeId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
        question:
          $ref: '#/components/schemas/QuestionInput'
        criteria:
          $ref: '#/components/schemas/RubricCriteria'
        totalPoints:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - lineageId
      - version
      - itemType
      - scopeType
      - scopeId
      - title
      - status
      - createdAt
    QuestionInput:
      type: object
      properties:
        scopeType:
          type: string
          enum:
          - SUBJECT
          - CLASS
        scopeId:
          type: string
          format: uuid
        questionType:
          type: string
          enum: *id002
        title:
          type: string
          maxLength: 200
        difficulty:
          type: string
          enum:
          - EASY
          - MEDIUM
          - HARD
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 50
        lessonRefs:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        defaultPoints:
          type: number
        definition:
          type: object
          description: 'Theo questionType: MCQ (stem, options 2-6, correct); ESSAY (stem, answerGuide); DOCUMENT (stem, skeleton
            theo document.json, requiredDiagrams); CODE (stem, language, starterFiles, referenceFiles, tests).'
      required:
      - scopeType
      - scopeId
      - questionType
      - title
      - definition
    RubricCriteria:
      type: object
      properties:
        criteria:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    text:
                      type: string
                    points:
                      type: number
                  required:
                  - id
                  - text
                  - points
            required:
            - id
            - title
            - items
      required:
      - criteria
    QuestionView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        questionType:
          type: string
          enum: *id002
        definition:
          type: object
          additionalProperties: true
      required:
      - id
      - questionType
      - definition
    ImportRow:
      type: object
      properties:
        lineNo:
          type: integer
        result:
          type: string
          enum:
          - CREATED
          - ERROR
        reason:
          type: string
      required:
      - lineNo
      - result
