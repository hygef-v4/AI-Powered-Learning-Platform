openapi: 3.1.0
info:
  title: U04 - Subject, Class & Enrollment
  version: 1.0.0
  description: 'Môn, lớp, ghi danh, mã mời và lớp của người học.


    Lỗi trả về dạng problem-details (`common.yaml`). `x-roles`: vai trò được gọi; quyền theo phạm vi (lớp, môn, chủ sở hữu)
    vẫn do backend kiểm.'
servers:
- url: /
security:
- cookieAuth: []
tags:
- name: U04 Subject, Class & Enrollment
  description: Môn, lớp, ghi danh, mã mời và lớp của người học.
paths:
  /api/v1/subjects:
    get:
      operationId: listSubjects
      summary: Danh sách môn
      x-roles: &id003
      - TEACHER
      - SUBJECT_MANAGER
      - ADMIN
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: &id002
          - ACTIVE
          - ARCHIVED
      - name: manager
        in: query
        required: false
        schema:
          type: string
          enum:
          - me
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/PageMeta
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Subject'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
      tags:
      - U04 Subject, Class & Enrollment
    post:
      operationId: createSubject
      summary: Tạo môn
      x-roles: &id001
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^[A-Z0-9-]{1,20}$
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
              required:
              - code
              - name
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/subjects/{subjectId}:
    get:
      operationId: getSubject
      summary: Chi tiết môn
      x-roles:
      - SUBJECT_MANAGER
      - ADMIN
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U04 Subject, Class & Enrollment
    patch:
      operationId: updateSubject
      summary: Sửa môn, lưu trữ hoặc mở lại
      x-roles: *id001
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                status:
                  type: string
                  enum: *id002
                version:
                  type: integer
              required:
              - version
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/subjects/{subjectId}/manager:
    put:
      operationId: assignSubjectManager
      summary: Gán hoặc gỡ Chủ nhiệm môn
      x-roles: *id001
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type:
                  - string
                  - 'null'
                  format: uuid
              required:
              - accountId
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes:
    get:
      operationId: listClasses
      summary: Danh sách lớp trong phạm vi
      x-roles: *id003
      parameters:
      - name: subjectId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: &id004
          - DRAFT
          - OPEN
          - ARCHIVED
      - name: term
        in: query
        required: false
        schema:
          type: string
      - name: teacher
        in: query
        required: false
        schema:
          type: string
          enum:
          - me
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/PageMeta
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/CourseClass'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
      tags:
      - U04 Subject, Class & Enrollment
    post:
      operationId: createClass
      summary: Tạo lớp (ADMIN hoặc Chủ nhiệm môn của môn)
      x-roles:
      - SUBJECT_MANAGER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectId:
                  type: string
                  format: uuid
                code:
                  type: string
                  maxLength: 30
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                term:
                  type: string
                  maxLength: 20
                teacherAccountId:
                  type: string
                  format: uuid
              required:
              - subjectId
              - code
              - name
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseClass'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}:
    get:
      operationId: getClass
      summary: Chi tiết lớp
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseClass'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U04 Subject, Class & Enrollment
    patch:
      operationId: updateClass
      summary: Sửa thông tin lớp
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                term:
                  type: string
                  maxLength: 20
                version:
                  type: integer
              required:
              - version
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseClass'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}/teacher:
    put:
      operationId: assignTeacher
      summary: Gán giảng viên chính
      x-roles:
      - SUBJECT_MANAGER
      - ADMIN
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  format: uuid
              required:
              - accountId
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseClass'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}/state:
    post:
      operationId: changeClassState
      summary: Mở, lưu trữ hoặc mở lại lớp
      description: Mở lại bị từ chối trả 422 kèm danh sách người vướng.
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum: *id004
                version:
                  type: integer
              required:
              - target
              - version
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseClass'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}/grade-distribution:
    patch:
      operationId: setGradeDistribution
      summary: Bật/tắt phân bố điểm ẩn danh
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
              - enabled
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseClass'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}/student-candidates:
    get:
      operationId: searchStudentCandidates
      summary: Tìm sinh viên để thêm
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentCandidate'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}/enrollments:
    get:
      operationId: listEnrollments
      summary: Người học của lớp
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - REMOVED
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/PageMeta
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Enrollment'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U04 Subject, Class & Enrollment
    post:
      operationId: enrollStudent
      summary: Thêm hoặc ghi danh lại một người học
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  format: uuid
              required:
              - accountId
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}/enrollments:bulk:
    post:
      operationId: enrollStudentsBulk
      summary: Thêm theo danh sách email (≤ 200)
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  type: array
                  maxItems: 200
                  items:
                    type: string
              required:
              - emails
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrollmentRowResult'
                required:
                - rows
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}/enrollments/{accountId}:
    delete:
      operationId: removeEnrollment
      summary: Gỡ người học
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Thành công
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/classes/{classId}/invite:
    put:
      operationId: updateInviteCode
      summary: Bật/tắt, đặt hạn hoặc đổi mã mời
      x-roles: *id003
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                expiresAt:
                  type: string
                  format: date-time
                regenerate:
                  type: boolean
              required:
              - enabled
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCode'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/me/classes:
    get:
      operationId: listMyClasses
      summary: Lớp của tôi (đang học / đã kết thúc)
      x-roles: &id005
      - STUDENT
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyClass'
                  finished:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyClass'
                required:
                - current
                - finished
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/me/classes:join:
    post:
      operationId: joinByInviteCode
      summary: Tham gia lớp bằng mã mời
      description: Mã sai, hết hạn hoặc lớp không mở đều trả cùng một lỗi chung.
      x-roles: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^[A-Z0-9]{8}$
              required:
              - code
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyClass'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
      tags:
      - U04 Subject, Class & Enrollment
  /api/v1/me/classes/{classId}:
    get:
      operationId: getMyClass
      summary: Lớp của người học kèm module và học liệu ACTIVE
      x-roles: *id005
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentClassView'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U04 Subject, Class & Enrollment
components:
  securitySchemes:
    cookieAuth:
      $ref: ./common.yaml#/components/securitySchemes/cookieAuth
  schemas:
    Subject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: *id002
        manager:
          type:
          - object
          - 'null'
          properties:
            accountId:
              type: string
              format: uuid
            displayName:
