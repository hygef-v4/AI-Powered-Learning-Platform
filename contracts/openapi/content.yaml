openapi: 3.1.0
info:
  title: U05 - Content & Material
  version: 1.0.0
  description: 'Module, học liệu (tệp/YouTube, quét nền) và thông báo lớp kèm bình luận.


    Lỗi trả về dạng problem-details (`common.yaml`). `x-roles`: vai trò được gọi; quyền theo phạm vi (lớp, môn, chủ sở hữu)
    vẫn do backend kiểm.'
servers:
- url: /
security:
- cookieAuth: []
tags:
- name: U05 Content & Material
  description: Module, học liệu (tệp/YouTube, quét nền) và thông báo lớp kèm bình luận.
paths:
  /api/v1/subjects/{subjectId}/modules:
    get:
      operationId: listSubjectModules
      summary: Module và học liệu của môn
      x-roles: &id003
      - TEACHER
      - SUBJECT_MANAGER
      - ADMIN
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: includeArchived
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
    post:
      operationId: createModule
      summary: Thêm module
      x-roles: &id001
      - SUBJECT_MANAGER
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
              required:
              - title
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
  /api/v1/modules/{moduleId}:
    patch:
      operationId: updateModule
      summary: Đổi tên, thứ tự hoặc lưu trữ module
      x-roles: *id001
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                orderNo:
                  type: integer
                status:
                  type: string
                  enum:
                  - ACTIVE
                  - ARCHIVED
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
  /api/v1/classes/{classId}/modules:
    get:
      operationId: listClassModules
      summary: Module của môn kèm học liệu của môn và của lớp
      x-roles: &id005
      - STUDENT
      - TEACHER
      - SUBJECT_MANAGER
      - ADMIN
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
  /api/v1/subjects/{subjectId}/modules/{moduleId}/lessons:
    post:
      operationId: addSubjectLessons
      summary: Thêm học liệu của môn
      x-roles: *id001
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: &id002
              oneOf:
              - type: object
                properties:
                  sourceType:
                    const: FILE
                  fileRefs:
                    type: array
                    minItems: 1
                    items:
                      type: string
                required:
                - sourceType
                - fileRefs
              - type: object
                properties:
                  sourceType:
                    const: YOUTUBE
                  youtubeUrl:
                    type: string
                required:
                - sourceType
                - youtubeUrl
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U05 Content & Material
  /api/v1/classes/{classId}/modules/{moduleId}/lessons:
    post:
      operationId: addClassLessons
      summary: Thêm học liệu của lớp
      x-roles: &id006
      - TEACHER
      - SUBJECT_MANAGER
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '422':
          $ref: ./common.yaml#/components/responses/Unprocessable
      tags:
      - U05 Content & Material
  /api/v1/lessons/{lessonId}:
    patch:
      operationId: updateLesson
      summary: Đổi tên, thứ tự hoặc lưu trữ học liệu
      x-roles: *id003
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                orderNo:
                  type: integer
                status:
                  type: string
                  enum:
                  - ACTIVE
                  - ARCHIVED
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
  /api/v1/lessons/{lessonId}/scan:
    get:
      operationId: getLessonScan
      summary: Trạng thái quét
      x-roles: *id003
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanStatus:
                    type: string
                    enum: &id004
                    - PENDING
                    - SCANNING
                    - INDEXED
                    - NO_TEXT
                    - NO_CAPTION
                    - NO_CREDIT
                    - BUSY
                    - FAILED
                  scannedAt:
                    type: string
                    format: date-time
                required:
                - scanStatus
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
    post:
      operationId: rescanLesson
      summary: Quét lại (FAILED, BUSY, NO_CREDIT)
      x-roles: *id003
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanStatus:
                    type: string
                    enum: *id004
                required:
                - scanStatus
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      tags:
      - U05 Content & Material
  /api/v1/classes/{classId}/lessons/{lessonId}/download:
    post:
      operationId: getLessonDownload
      summary: URL tải học liệu (token 5 phút)
      x-roles: *id005
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                required:
                - url
                - expiresAt
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
  /api/v1/classes/{classId}/announcements:
    get:
      operationId: listAnnouncements
      summary: Thông báo lớp (mới nhất trước, kèm 2 bình luận mới nhất)
      x-roles: *id005
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/PageMeta
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Announcement'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
    post:
      operationId: postAnnouncement
      summary: Đăng thông báo
      x-roles: *id006
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  maxLength: 10000
              required:
              - body
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
  /api/v1/classes/{classId}/announcements/{announcementId}:hide:
    post:
      operationId: hideAnnouncement
      summary: Ẩn thông báo
      x-roles: *id006
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: announcementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
              required:
              - reason
      responses:
        '204':
          description: Thành công
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
  /api/v1/announcements/{announcementId}/comments:
    get:
      operationId: listComments
      summary: Bình luận (cũ → mới)
      x-roles: *id005
      parameters:
      - name: announcementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/PageMeta
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Comment'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
    post:
      operationId: postComment
      summary: Viết bình luận
      x-roles:
      - STUDENT
      - TEACHER
      - SUBJECT_MANAGER
      parameters:
      - name: announcementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  maxLength: 2000
              required:
              - body
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
  /api/v1/announcement-comments/{commentId}:hide:
    post:
      operationId: hideComment
      summary: Ẩn bình luận
      x-roles: *id006
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
              required:
              - reason
      responses:
        '204':
          description: Thành công
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
      tags:
      - U05 Content & Material
components:
  securitySchemes:
    cookieAuth:
      $ref: ./common.yaml#/components/securitySchemes/cookieAuth
  schemas:
    Module:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        title:
          type: string
        orderNo:
          type: integer
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
      required:
      - id
      - subjectId
      - title
      - orderNo
      - status
      - lessons
    Lesson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        moduleId:
          type: string
          format: uuid
        classId:
          type:
          - string
          - 'null'
          format: uuid
        title:
          type: string
        orderNo:
          type: integer
        sourceType:
          type: string
          enum:
          - FILE
          - YOUTUBE
        mimeType:
          type: string
        youtubeUrl:
          type: string
        scanStatus:
          type: string
          enum: *id004
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        subjectMaterial:
          type: boolean
      required:
      - id
      - moduleId
      - title
      - orderNo
      - sourceType
      - status
      - subjectMaterial
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        authorName:
          type: string
        body:
          type: string
        postedAt:
          type: string
          format: date-time
        commentCount:
          type: integer
        latestComments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      required:
      - id
      - classId
      - authorName
      - body
      - postedAt
      - commentCount
      - latestComments
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        announcementId:
          type: string
          format: uuid
        authorName:
          type: string
        body:
          type: string
        postedAt:
          type: string
          format: date-time
      required:
      - id
      - announcementId
      - authorName
      - body
      - postedAt
