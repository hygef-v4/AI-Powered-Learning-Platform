# Ghép với docker-compose.yml khi chạy local:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env.local up --build
# Build từ mã nguồn, Nginx không TLS ở cổng 8088, thêm Mailpit, mở cổng datastore để debug.
services:
  nginx:
    ports: !override
      - "8088:80"
    environment:
      DOMAIN: localhost
    volumes: !override
      - ./nginx/local:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro

  certbot: !reset {}

  frontend:
    image: platform-frontend:local
    build: ../frontend

  backend:
    image: platform-backend:local
    build: ../backend
    environment: &local-mail
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH_ENABLED: "false"
      SMTP_STARTTLS_ENABLED: "false"
      SMTP_FROM: no-reply@platform.local
      # U01: Nginx local chạy HTTP nên cookie không đặt cờ Secure (chỉ ở local).
      U01_COOKIE_SECURE: "false"
      # Rút ngắn khóa tạm khi thử tay (mặc định 15m).
      U01_LOGIN_LOCK_DURATION: ${U01_LOGIN_LOCK_DURATION:-15m}
      U03_REQUIRE_DRIVE: "false"
      U03_LOCAL_STORAGE_DIR: /app/data/files
      U03_LOCAL_BACKUP_DIR: /app/data/backups
    volumes:
      - files-local:/app/data/files
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  worker:
    image: platform-backend:local
    environment: *local-mail
    volumes:
      - files-local:/app/data/files
      - backups-local:/app/data/backups

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [internal]

volumes:
  files-local: {}
  backups-local: {}
