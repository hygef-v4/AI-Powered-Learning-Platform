# Staging trên cùng VPS với production, cho nhóm kiểm thử. Ghép với docker-compose.yml, project riêng:
#   docker compose -p platform-staging -f docker-compose.yml -f docker-compose.staging.yml --env-file .env up -d
# Chạy từ bản checkout riêng (/opt/platform-staging), nên .env, database, Redis, RabbitMQ và volume đều tách khỏi
# production. HTTPS ở cổng 8443 bằng Nginx riêng; không đụng cổng 80/443 của production. Email vào Mailpit, xem ở
# https://<DOMAIN>:8443/mailpit/ (có mật khẩu). Giới hạn tài nguyên giảm để chạy được cạnh production trên VPS 6 GB.
# Xem docs/runbooks/deploy-staging.md.
services:
  nginx:
    depends_on:
      mailpit: { condition: service_started }
    ports: !override
      - "8443:443"
    volumes: !override
      - ./nginx/staging:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./staging-htpasswd:/etc/nginx/staging-htpasswd:ro
      - letsencrypt:/etc/letsencrypt:ro
    # Nạp lại chứng chỉ mỗi 12 giờ để nhận bản certbot đã gia hạn. Vẫn đi qua /docker-entrypoint.sh để tạo cấu hình
    # từ template.
    entrypoint: ["/bin/sh", "-c", "(while sleep 12h; do nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    networks: [edge]
    deploy:
      resources: { limits: { cpus: "0.25", memory: 64M } }

  # Cổng 80 thuộc production và VPS chặn kết nối quốc tế đi vào: cấp và gia hạn bằng DNS-01 qua Cloudflare.
  certbot:
    image: certbot/dns-cloudflare:v4.1.1@sha256:bf87c2e3588f08c7fd520cc2fd155a954850c68d92105d693b26cd12dc3fca28
    volumes: !override
      - letsencrypt:/etc/letsencrypt
      - ./cloudflare.ini:/run/secrets/cloudflare.ini:ro
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"]

  frontend:
    environment:
      # Staging không bao giờ được index, kể cả khi .env đặt khác (robots.txt chặn hết, mọi trang có noindex).
      SEO_INDEXABLE: "false"
      GOOGLE_SITE_VERIFICATION: ""
    deploy:
      resources: { limits: { cpus: "0.5", memory: 384M } }

  backend:
    environment: &staging-env
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_AUTH_ENABLED: "false"
      SMTP_STARTTLS_ENABLED: "false"
      SMTP_FROM: ${SMTP_FROM:-no-reply@staging.local}
      MAIL_TRANSPORT: smtp
      U03_REQUIRE_DRIVE: "false"
      U03_LOCAL_STORAGE_DIR: /app/data/files
      U03_LOCAL_BACKUP_DIR: /app/data/backups
    volumes:
      - files-staging:/app/data/files
    deploy:
      resources: { limits: { cpus: "1", memory: 768M } }

  worker:
    environment: *staging-env
    volumes:
      - files-staging:/app/data/files
      - backups-staging:/app/data/backups
    deploy:
      resources: { limits: { cpus: "0.75", memory: 768M } }

  postgres:
    deploy:
      resources: { limits: { cpus: "0.75", memory: 512M } }

  redis:
    deploy:
      resources: { limits: { cpus: "0.25", memory: 128M } }

  rabbitmq:
    deploy:
      resources: { limits: { cpus: "0.5", memory: 384M } }

  # Nhận mọi email của staging; không gửi ra ngoài. Giao diện chỉ mở qua Nginx ở /mailpit/.
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    environment:
      MP_WEBROOT: /mailpit/
      MP_MAX_MESSAGES: "2000"
    networks: [internal, edge]
    deploy:
      resources: { limits: { cpus: "0.25", memory: 64M } }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

volumes:
  files-staging: {}
  backups-staging: {}
