# Production/demo trên VPS. Secret nằm trong infra/.env (quyền 600, CI ghi khi deploy).
# Local: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# Judge0 (4 container, mạng `sandbox`) do U13 thêm.
name: platform

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: platform
  POSTGRES_APP_USER: app
  POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
  POSTGRES_MIGRATOR_USER: migrator
  POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: app
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
  SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTH_ENABLED: ${SMTP_AUTH_ENABLED:-true}
  SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
  SMTP_FROM: ${SMTP_FROM:-}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?}
  U01_JWT_SECRET: ${U01_JWT_SECRET:?}
  U03_FILEREF_SECRET: ${U03_FILEREF_SECRET:?}
  GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY:-}
  GOOGLE_SHARED_DRIVE_ID: ${GOOGLE_SHARED_DRIVE_ID:-}
  U03_REQUIRE_DRIVE: "true"

services:
  nginx:
    image: nginx:1.28-alpine
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources: { limits: { cpus: "0.25", memory: 128M } }
    logging: *logging
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v4.1.1
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER:-max2min}/platform-frontend:${IMAGE_TAG:?}
    networks: [edge]
    deploy:
      resources: { limits: { cpus: "0.5", memory: 512M } }
    logging: *logging
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER:-max2min}/platform-backend:${IMAGE_TAG:?}
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes:
      - upload-tmp:/tmp/uploads
    networks: [edge, internal]
    deploy:
      resources: { limits: { cpus: "1", memory: 1G } }
    logging: *logging
    restart: unless-stopped

  worker:
    image: ghcr.io/${GHCR_OWNER:-max2min}/platform-backend:${IMAGE_TAG:?}
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [internal]
    deploy:
      resources: { limits: { cpus: "1", memory: 1536M } }
    logging: *logging
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources: { limits: { cpus: "1", memory: 1G } }
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    deploy:
      resources: { limits: { cpus: "0.25", memory: 256M } }
    logging: *logging
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # Đặt user mặc định là `app` nên RabbitMQ không tạo `guest`.
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: /platform
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources: { limits: { cpus: "0.5", memory: 512M } }
    logging: *logging
    restart: unless-stopped

networks:
  edge: {}
  internal: {}

volumes:
  pgdata: {}
  rabbitmq-data: {}
  upload-tmp: {}
  letsencrypt: {}
  certbot-www: {}
