# Production/demo trên VPS. Secret nằm trong infra/.env (quyền 600), không commit.
#   docker compose --env-file .env up -d
# Local: docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env.local up --build
name: platform

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Biến cho backend và worker. Biến riêng của unit để trống được cho tới khi unit đó có code.
x-backend-env: &backend-env
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?}
  POSTGRES_HOST: postgres
  POSTGRES_DB: platform
  POSTGRES_APP_USER: app
  POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
  POSTGRES_MIGRATOR_USER: migrator
  POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: app
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
  RABBITMQ_VHOST: /platform
  SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTH_ENABLED: ${SMTP_AUTH_ENABLED:-true}
  SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
  SMTP_FROM: ${SMTP_FROM:-}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  U01_JWT_SECRET: ${U01_JWT_SECRET:-}
  U01_BOOTSTRAP_ADMIN_EMAIL: ${U01_BOOTSTRAP_ADMIN_EMAIL:-}
  U01_BOOTSTRAP_ADMIN_NAME: ${U01_BOOTSTRAP_ADMIN_NAME:-Quản trị viên}
  U03_FILEREF_SECRET: ${U03_FILEREF_SECRET:-}
  U03_UPLOAD_TMP_DIR: /tmp/uploads
  U03_BACKUP_TMP_DIR: /tmp/backup
  GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY:-}
  GOOGLE_SHARED_DRIVE_ID: ${GOOGLE_SHARED_DRIVE_ID:-}
  GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${GOOGLE_DRIVE_OAUTH_CLIENT_ID:-}
  GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${GOOGLE_DRIVE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN: ${GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN:-}
  GOOGLE_DRIVE_FOLDER_NAME: ${GOOGLE_DRIVE_FOLDER_NAME:-}
  GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
  GOOGLE_BACKUP_FOLDER_ID: ${GOOGLE_BACKUP_FOLDER_ID:-}
  U03_BACKUP_PUBLIC_KEY: ${U03_BACKUP_PUBLIC_KEY:-}
  BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
  U06_AI_KEY_ENCRYPTION_KEY: ${U06_AI_KEY_ENCRYPTION_KEY:-}
  U06_AI_KEY_ENCRYPTION_KEY_V2: ${U06_AI_KEY_ENCRYPTION_KEY_V2:-}
  U14_EMAIL_DAILY_CAP: ${U14_EMAIL_DAILY_CAP:-300}

services:
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources: { limits: { cpus: "0.25", memory: 128M } }
    logging: *logging
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v4.1.1@sha256:263fe7ee9dde6440bf8baa957c0a8eb0118fc05ef86cf743c4cc84ca84303a21
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER:-max2min}/platform-frontend:${IMAGE_TAG:?}
    environment:
      # SEO: production cho máy tìm kiếm index trang công khai; staging ghi đè thành false.
      SEO_INDEXABLE: ${SEO_INDEXABLE:-true}
      # Mã thẻ meta của Google Search Console (chỉ phần content); để trống nếu đã xác minh bằng cách khác.
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    networks: [edge]
    deploy:
      resources: { limits: { cpus: "0.5", memory: 512M } }
    logging: *logging
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER:-max2min}/platform-backend:${IMAGE_TAG:?}
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes:
      - upload-tmp:/tmp/uploads
    networks: [edge, internal]
    # 2 CPU: khởi động nhanh hơn (đo trên VPS với 1 CPU: 73 giây, trong lúc đó nginx trả 503) và JVM chọn G1
    # thay cho SerialGC.
    deploy:
      resources: { limits: { cpus: "2", memory: 1G } }
    logging: *logging
    restart: unless-stopped

  # Cùng image với backend, profile worker; chỉ nằm trong mạng internal (U03).
  worker:
    image: ghcr.io/${GHCR_OWNER:-max2min}/platform-backend:${IMAGE_TAG:?}
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes:
      - backup-tmp:/tmp/backup
      - wal-archive:/wal-archive
    networks: [internal]
    deploy:
      resources: { limits: { cpus: "1", memory: 1536M } }
    logging: *logging
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - wal-archive:/wal-archive
    # Thư mục WAL archive dùng chung với worker (U03): worker đọc, tải lên Drive rồi xóa nên thư mục mở quyền ghi.
    entrypoint:
      - sh
      - -c
      - mkdir -p /wal-archive && chown postgres:postgres /wal-archive && chmod 0777 /wal-archive && exec docker-entrypoint.sh "$$@"
      - --
    # Ghi truy vấn chậm hơn 500 ms (không ghi giá trị tham số) và thống kê theo câu lệnh.
    # Xem thống kê cần chạy một lần CREATE EXTENSION pg_stat_statements: docs/runbooks/deploy-vps.md.
    # WAL archiving (U03, 2026-11-26): chốt tệp WAL tối đa mỗi 5 phút, archive_command chỉ chép vào /wal-archive
    # trên máy, không gọi mạng; worker tải lên Google Drive.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500
      - -c
      - log_parameter_max_length=0
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=5min
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f.tmp && chmod 0644 /wal-archive/%f.tmp && mv /wal-archive/%f.tmp /wal-archive/%f
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources: { limits: { cpus: "1", memory: 1G } }
    logging: *logging
    restart: unless-stopped

  # Không bật persistence: khởi động lại thì phiên, OTP, token tải tệp mất (U01, U03).
  # maxmemory thấp hơn giới hạn container (staging 128M) để đầy thì Redis từ chối ghi thay vì bị OOM kill;
  # noeviction vì dữ liệu là phiên và OTP, không phải cache.
  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "no", "--save", "", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources: { limits: { cpus: "0.25", memory: 256M } }
    logging: *logging
    restart: unless-stopped

  # User mặc định là app nên RabbitMQ không tạo guest.
  rabbitmq:
    image: rabbitmq:4.1-management-alpine@sha256:42c6214e0e2093caa2484718faacb733631cc9ddc869b3298397613237dbea4a
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: /platform
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]
    # CLI Erlang khởi động chậm khi giới hạn 0.5 CPU (đo trên VPS: khoảng 7 giây); timeout ngắn báo unhealthy giả và
    # chặn backend, worker khởi động lại.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 20s
      start_period: 60s
      retries: 5
    deploy:
      resources: { limits: { cpus: "0.5", memory: 512M } }
    logging: *logging
    restart: unless-stopped

networks:
  edge: {}
  internal: {}

volumes:
  pgdata: {}
  rabbitmq-data: {}
  upload-tmp: {}
  backup-tmp: {}
  wal-archive: {}
  letsencrypt: {}
  certbot-www: {}
