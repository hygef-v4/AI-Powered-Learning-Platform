# Cấp http, include ở đầu mỗi template (production, staging, local).

# Không gửi số phiên bản nginx trong header Server và trang lỗi (SEC-006; TC-SEC-052, 053).
server_tokens off;

# Token tải tệp nằm trong đường dẫn (U03, hạn 5 phút): access log ghi "REDACTED" thay cho token, cả ở dòng request và
# Referer, vì log không được chứa token (SEC-005; TC-SEC-036). error_log của nginx vẫn có thể ghi URL đầy đủ khi lỗi.
map $request $request_redacted {
    "~^(?<rq_head>\S+ /api/v1/files/download/)[^\s?]+(?<rq_tail>.*)$" "${rq_head}REDACTED${rq_tail}";
    default $request;
}
map $http_referer $referer_redacted {
    "" "-";
    "~^(?<rf_head>.*/api/v1/files/download/)[^?#]+(?<rf_tail>.*)$" "${rf_head}REDACTED${rf_tail}";
    default $http_referer;
}

# Như định dạng mặc định, thêm thời gian xử lý: rt là cả request, urt là riêng backend/frontend (giây; "-" khi nginx tự trả).
log_format timed '$remote_addr - $remote_user [$time_local] "$request_redacted" '
                 '$status $body_bytes_sent "$referer_redacted" '
                 '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

# Next.js tự nén HTML, JS, CSS; backend không nén JSON nên nén ở đây. text/event-stream (SSE) không nằm trong danh sách.
gzip on;
gzip_types application/json application/problem+json;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
