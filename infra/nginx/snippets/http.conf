# Cấp http, include ở đầu mỗi template (production, staging, local).

# Như định dạng mặc định, thêm thời gian xử lý: rt là cả request, urt là riêng backend/frontend (giây; "-" khi nginx tự trả).
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

# Next.js tự nén HTML, JS, CSS; backend không nén JSON nên nén ở đây. text/event-stream (SSE) không nằm trong danh sách.
gzip on;
gzip_types application/json application/problem+json;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
