proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Nginx là điểm vào duy nhất: ghi đè, không nối X-Forwarded-For client gửi. Nối thêm thì client trong mạng nội bộ
# (192.168.x, 10.x — Tomcat coi là proxy tin cậy) giả được IP và lách rate limit theo IP của U01.
# Nếu sau này đặt load balancer phía trước, dùng real_ip_header/set_real_ip_from để $remote_addr là IP client thật.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
