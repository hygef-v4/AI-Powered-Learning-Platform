# Định tuyến dùng chung cho bản production và local (shared-infrastructure §3).
client_max_body_size 50m;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location = /nginx-health {
    access_log off;
    return 200 "ok";
}

# Webhook PayOS: body nhỏ.
location = /api/v1/payments/payos/webhook {
    client_max_body_size 16k;
    proxy_pass http://backend:8080;
}

# Upload file: không đệm request, chờ lâu hơn.
location /api/v1/files {
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://backend:8080;
}

# Lưu nháp bài làm và mục bài nhóm.
location ~ ^/api/v1/attempts/[^/]+/content$ {
    client_max_body_size 12m;
    proxy_pass http://backend:8080;
}
location ~ ^/api/v1/group-docs/[^/]+/sections/[^/]+/draft$ {
    client_max_body_size 12m;
    proxy_pass http://backend:8080;
}

# Nhập DOCX (khung giảng viên, bài của người học).
location ~ ^/api/v1/(assignments/[^/]+/skeleton:import-docx|attempts/[^/]+/docx:preview)$ {
    client_max_body_size 20m;
    proxy_read_timeout 60s;
    proxy_pass http://backend:8080;
}

# SSE: tài liệu nhóm và chuông thông báo.
location ~ ^/api/v1/(group-docs/[^/]+/events|me/notifications/stream)$ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://backend:8080;
}

location /api/ {
    proxy_pass http://backend:8080;
}

location / {
    proxy_pass http://frontend:3000;
}
