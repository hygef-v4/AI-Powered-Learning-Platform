# Dùng chung cho bản TLS và bản local.
# Phân giải tên container qua DNS của Docker mỗi 10 giây: container backend/frontend được tạo lại thì đổi IP,
# viết thẳng tên trong proxy_pass thì nginx giữ IP cũ lúc khởi động và trả 502.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream http://backend:8080;
set $frontend_upstream http://frontend:3000;

location = /nginx-health {
    access_log off;
    return 200 "ok";
}

# Upload tệp (U03): trần 50 MB, không đệm body.
location /api/v1/files {
    client_max_body_size 50m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $backend_upstream;
}

# REST và SSE; endpoint SSE (U12, U14) tự gửi X-Accel-Buffering: no.
location /api/ {
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $backend_upstream;
}

# MCP server (U06), Streamable HTTP.
location /mcp {
    client_max_body_size 1m;
    proxy_buffering off;
    proxy_read_timeout 300s;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $backend_upstream;
}

location / {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $frontend_upstream;
}
