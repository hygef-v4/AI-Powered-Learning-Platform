# Dùng chung cho bản TLS và bản local.
# Phân giải tên container qua DNS của Docker mỗi 10 giây: container backend/frontend được tạo lại thì đổi IP,
# viết thẳng tên trong proxy_pass thì nginx giữ IP cũ lúc khởi động và trả 502.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream http://backend:8080;
set $frontend_upstream http://frontend:3000;

access_log /var/log/nginx/access.log timed;

location = /nginx-health {
    access_log off;
    return 200 "ok";
}

# Bot dò WordPress/PHP: trả 404 tại đây, không chuyển tới Next.js. Không áp cho /api và /mcp.
location ~* ^/(?!api/|mcp)(wp-(admin|login|content|includes)|.*\.php$) {
    return 404;
}

# Backend hoặc frontend chưa nhận kết nối (đang khởi động lại khi deploy): nginx tự sinh 502/503.
# API nhận problem+json 503 kèm Retry-After, trang nhận trang bảo trì tĩnh. 504 (quá proxy_read_timeout) giữ nguyên.
# add_header trong location thay cho header kế thừa từ server nên phải include lại security-headers.
location @backend_unavailable {
    default_type application/problem+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Retry-After 15 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The service is restarting. Try again shortly."}';
}

location = /maintenance.html {
    internal;
    root /etc/nginx/snippets;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Retry-After 15 always;
    add_header Cache-Control "no-store" always;
}

# Upload tệp (U03): trần 50 MB, không đệm body.
location /api/v1/files {
    client_max_body_size 50m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    include /etc/nginx/snippets/proxy.conf;
    error_page 502 503 =503 @backend_unavailable;
    proxy_pass $backend_upstream;
}

# REST và SSE; endpoint SSE (U12, U14) tự gửi X-Accel-Buffering: no.
location /api/ {
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    include /etc/nginx/snippets/proxy.conf;
    error_page 502 503 =503 @backend_unavailable;
    proxy_pass $backend_upstream;
}

# MCP server (U06), Streamable HTTP.
location /mcp {
    client_max_body_size 1m;
    proxy_buffering off;
    proxy_read_timeout 300s;
    include /etc/nginx/snippets/proxy.conf;
    error_page 502 503 =503 @backend_unavailable;
    proxy_pass $backend_upstream;
}

location / {
    include /etc/nginx/snippets/proxy.conf;
    error_page 502 503 =503 /maintenance.html;
    proxy_pass $frontend_upstream;
}
