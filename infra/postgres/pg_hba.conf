# pg_hba.conf của Postgres trong stack, gắn qua hba_file nên áp dụng cả cho volume dữ liệu đã có.
# Giống tệp mặc định của image postgres, thêm dòng replication cho base backup của worker (U03, 2026-11-26).
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     backup_replicator  all                  scram-sha-256
host    all             all             all                     scram-sha-256
