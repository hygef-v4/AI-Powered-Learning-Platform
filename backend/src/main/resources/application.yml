spring:
  application:
    name: platform-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:platform}
    username: ${POSTGRES_APP_USER:app}
    password: ${POSTGRES_APP_PASSWORD:}
  flyway:
    # Mỗi unit một thư mục con trong db/migration/<package>; Flyway quét cả thư mục con.
    url: ${spring.datasource.url}
    user: ${POSTGRES_MIGRATOR_USER:migrator}
    password: ${POSTGRES_MIGRATOR_PASSWORD:}
    locations: classpath:db/migration
    # Unit làm sau có thể có version nhỏ hơn migration đã chạy của unit khác (ví dụ U06 1200 sau U11 1700).
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/platform}
    connection-timeout: 5s
    publisher-confirm-type: simple
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH_ENABLED:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
      location: ${U03_UPLOAD_TMP_DIR:${java.io.tmpdir}}

server:
  port: 8080
  shutdown: graceful
  # Nginx đứng trước: lấy IP client từ X-Forwarded-For của proxy nội bộ (rate limit theo IP, U01).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP lỗi không làm backend thành unhealthy; lỗi gửi mail xử lý ở việc nền.
    mail:
      enabled: false

platform:
  # U01 Account & Access (logical-components mục 4)
  identity:
    allowed-email-domains: ${U01_ALLOWED_EMAIL_DOMAINS:}
    jwt-secret: ${U01_JWT_SECRET:}
    access-ttl: ${U01_ACCESS_TTL:15m}
    refresh-idle-ttl: ${U01_REFRESH_IDLE_TTL:2h}
    refresh-max-ttl: ${U01_REFRESH_MAX_TTL:7d}
    bcrypt-cost: ${U01_BCRYPT_COST:12}
    otp-ttl: ${U01_OTP_TTL:10m}
    otp-max-attempts: ${U01_OTP_MAX_ATTEMPTS:5}
    login-lock-threshold: ${U01_LOGIN_LOCK_THRESHOLD:5}
    login-lock-duration: ${U01_LOGIN_LOCK_DURATION:15m}
    cookie-secure: ${U01_COOKIE_SECURE:true}
    mail-from: ${SMTP_FROM:}
    bootstrap-admin-email: ${U01_BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-name: ${U01_BOOTSTRAP_ADMIN_NAME:Quản trị viên}
    rate-limit:
      otp-per-email-per-hour: ${U01_RL_OTP_PER_EMAIL_PER_HOUR:5}
      otp-cooldown: ${U01_RL_OTP_COOLDOWN:60s}
      otp-per-ip-per-hour: ${U01_RL_OTP_PER_IP_PER_HOUR:20}
      login-per-ip: ${U01_RL_LOGIN_PER_IP:30}
      login-ip-window: ${U01_RL_LOGIN_IP_WINDOW:5m}
      password-change-failures: ${U01_RL_PASSWORD_CHANGE_FAILURES:5}
      password-change-window: ${U01_RL_PASSWORD_CHANGE_WINDOW:15m}
  # U06 AI Connections: khóa mã hóa key bắt buộc ở môi trường thật (base64 32 byte), không có giá trị mặc định.
  ai:
    key-encryption-key: ${U06_AI_KEY_ENCRYPTION_KEY:}
    key-encryption-key-v2: ${U06_AI_KEY_ENCRYPTION_KEY_V2:}
    request-timeout: ${U06_AI_REQUEST_TIMEOUT:120s}
    test-timeout: ${U06_AI_TEST_TIMEOUT:20s}
    providers:
      gemini:
        models: ${U06_GEMINI_MODELS:gemini-2.5-flash,gemini-2.5-pro}
        max-output-tokens: ${U06_GEMINI_MAX_OUTPUT:8192}
      openai:
        models: ${U06_OPENAI_MODELS:gpt-4.1-mini,gpt-4.1}
        max-output-tokens: ${U06_OPENAI_MAX_OUTPUT:8192}
      claude:
        models: ${U06_CLAUDE_MODELS:claude-sonnet-5-5,claude-haiku-5-5}
        max-output-tokens: ${U06_CLAUDE_MAX_OUTPUT:8192}
  # U03 Job and Settings
  files:
    fileref-secret: ${U03_FILEREF_SECRET:}
    require-drive: ${U03_REQUIRE_DRIVE:false}
    local-storage-dir: ${U03_LOCAL_STORAGE_DIR:}
    upload-tmp-dir: ${U03_UPLOAD_TMP_DIR:}
    drive-service-account-key: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY:}
    shared-drive-id: ${GOOGLE_SHARED_DRIVE_ID:}
  jobs:
    handler-timeout: ${U03_JOB_HANDLER_TIMEOUT:60s}
  settings:
    cache-ttl: ${U03_SETTINGS_CACHE_TTL:30s}
  backup:
    folder-id: ${GOOGLE_BACKUP_FOLDER_ID:}
    public-key: ${U03_BACKUP_PUBLIC_KEY:}
    db-host: ${POSTGRES_HOST:localhost}
    db-port: ${POSTGRES_PORT:5432}
    db-name: ${POSTGRES_DB:platform}
    db-user: backup_reader
    db-password: ${BACKUP_DB_PASSWORD:}
    tmp-dir: ${U03_BACKUP_TMP_DIR:}
    local-dir: ${U03_LOCAL_BACKUP_DIR:}
  # U07 Assignment Authoring: link trang xem sơ đồ ghi vào DOCX xuất ra (BR-U07-60).
  assignments:
    public-url: ${APP_PUBLIC_URL:http://localhost:8088}
  # U08 Assignment Work: giới hạn tần suất (BR-U08-44, 52).
  assignment-work:
    feedback-per-day: ${U08_FEEDBACK_PER_DAY:20}
    activity-events-per-minute: ${U08_ACTIVITY_EVENTS_PER_MINUTE:60}
