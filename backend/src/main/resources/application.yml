# Mọi giá trị nhạy cảm đọc từ biến môi trường (.env quyền 600 trên VPS); mỗi unit thêm khóa của mình.
spring:
  application:
    name: platform
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:platform}
    username: ${POSTGRES_APP_USER:app}
    password: ${POSTGRES_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    # Flyway dùng user `migrator`; runtime dùng user `app`.
    user: ${POSTGRES_MIGRATOR_USER:migrator}
    password: ${POSTGRES_MIGRATOR_PASSWORD}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: /platform
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    listener:
      simple:
        # Chỉ profile worker nhận việc nền.
        auto-startup: false
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH_ENABLED:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
      file-size-threshold: 0
      location: /tmp/uploads

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        ready:
          include: readinessState,db,redis,rabbit

platform:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  mail-from: ${SMTP_FROM:no-reply@localhost}
  worker:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
