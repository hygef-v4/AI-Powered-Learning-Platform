spring:
  application:
    name: platform-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:platform}
    username: ${POSTGRES_APP_USER:app}
    password: ${POSTGRES_APP_PASSWORD:}
  flyway:
    # Mỗi unit một thư mục con trong db/migration/<package>; Flyway quét cả thư mục con.
    url: ${spring.datasource.url}
    user: ${POSTGRES_MIGRATOR_USER:migrator}
    password: ${POSTGRES_MIGRATOR_PASSWORD:}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/platform}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH_ENABLED:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP lỗi không làm backend thành unhealthy; lỗi gửi mail xử lý ở việc nền.
    mail:
      enabled: false
