# Mọi giá trị nhạy cảm đọc từ biến môi trường (.env quyền 600 trên VPS); mỗi unit thêm khóa của mình.
spring:
  application:
    name: platform
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:platform}
    username: ${POSTGRES_APP_USER:app}
    password: ${POSTGRES_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    # Flyway dùng user `migrator`; runtime dùng user `app`.
    user: ${POSTGRES_MIGRATOR_USER:migrator}
    password: ${POSTGRES_MIGRATOR_PASSWORD}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: /platform
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    connection-timeout: 5s
    listener:
      simple:
        # Chỉ profile worker nhận việc nền.
        auto-startup: false
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH_ENABLED:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: ${U03_MAX_FILE_SIZE:50MB}
      max-request-size: 51MB
      file-size-threshold: 0
      location: ${U03_UPLOAD_TMP_DIR:/tmp/uploads}

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Google Drive lỗi chỉ làm health `DEGRADED` (HTTP 200), backend vẫn chạy (U03 P7).
      status:
        order: down,out-of-service,degraded,unknown,up
        http-mapping:
          degraded: 200
      group:
        ready:
          include: readinessState,db,redis,rabbit

platform:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  mail-from: ${SMTP_FROM:no-reply@localhost}
  worker:
    enabled: false
  # Tệp (U03, logical-components §3). Không có key Google Drive thì lưu vào thư mục local.
  files:
    max-concurrent-uploads: ${U03_MAX_CONCURRENT_UPLOADS:5}
    upload-tmp-dir: ${U03_UPLOAD_TMP_DIR:/tmp/uploads}
    download-token-ttl: ${U03_DOWNLOAD_TOKEN_TTL:5m}
    file-ref-secret: ${U03_FILEREF_SECRET:}
    file-ref-ttl: ${U03_FILEREF_TTL:1h}
    local-storage-dir: ${U03_LOCAL_STORAGE_DIR:./data/files}
    # true ở production/demo: thiếu key Drive thì báo không khả dụng thay vì lưu vào thư mục local.
    require-drive: ${U03_REQUIRE_DRIVE:false}
    drive:
      service-account-key: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY:}
      shared-drive-id: ${GOOGLE_SHARED_DRIVE_ID:}
  # Việc nền (U03, logical-components §4). Số mức backoff = số lượt thử lại tối đa.
  jobs:
    max-attempts: ${U03_JOB_MAX_ATTEMPTS:5}
    backoff: ${U03_JOB_BACKOFF:30s,1m,2m,4m,8m}
    sweep-interval: ${U03_SWEEP_INTERVAL:1m}
    sweep-republish-after: ${U03_SWEEP_REPUBLISH_AFTER:5m}
    scan-interval: ${U03_SCAN_INTERVAL:1m}
    handler-timeout: ${U03_JOB_HANDLER_TIMEOUT:60s}
    worker-max-concurrency: ${U03_WORKER_MAX_CONCURRENCY:4}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
