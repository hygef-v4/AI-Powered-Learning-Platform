openapi: 3.1.0
info:
  title: U15 Admin Dashboard
  version: 1.0.0
  description: Current-contract consumer slice A. No U03 contract changes; missing
    start/summary metadata remains unknown.
security:
- cookieAuth: []
paths:
  /api/v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      description: Read-only, active ADMIN only. No actor/role or unknown query parameters.
        No cache. Backup metadata only; no ID, archive references or credentials.
      responses:
        '200':
          description: Partial dashboard results
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardView'
        '400':
          description: Invalid query
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Authentication required
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Current active ADMIN required
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Authorization, audit or requested history unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/admin/dashboard/backups:
    get:
      operationId: getBackupHistory
      description: Read-only, active ADMIN only. No actor/role or unknown query parameters.
        No cache. Backup metadata only; no ID, archive references or credentials.
      responses:
        '200':
          description: History ordered by scheduledFor descending
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupHistoryPage'
        '400':
          description: Invalid query
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Authentication required
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Current active ADMIN required
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Authorization, audit or requested history unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    AccountCounts:
      type: object
      additionalProperties: false
      required:
      - byRoleAndStatus
      - total
      - activeTotal
      properties:
        byRoleAndStatus:
          type: object
          additionalProperties: false
          required:
          - ADMIN
          - SUBJECT_MANAGER
          - TEACHER
          - STUDENT
          properties:
            ADMIN:
              type: object
              additionalProperties: false
              required:
              - PENDING
              - ACTIVE
              - DISABLED
              properties:
                PENDING:
                  type: integer
                  format: int64
                  minimum: 0
                ACTIVE:
                  type: integer
                  format: int64
                  minimum: 0
                DISABLED:
                  type: integer
                  format: int64
                  minimum: 0
            SUBJECT_MANAGER:
              type: object
              additionalProperties: false
              required:
              - PENDING
              - ACTIVE
              - DISABLED
              properties:
                PENDING:
                  type: integer
                  format: int64
                  minimum: 0
                ACTIVE:
                  type: integer
                  format: int64
                  minimum: 0
                DISABLED:
                  type: integer
                  format: int64
                  minimum: 0
            TEACHER:
              type: object
              additionalProperties: false
              required:
              - PENDING
              - ACTIVE
              - DISABLED
              properties:
                PENDING:
                  type: integer
                  format: int64
                  minimum: 0
                ACTIVE:
                  type: integer
                  format: int64
                  minimum: 0
                DISABLED:
                  type: integer
                  format: int64
                  minimum: 0
            STUDENT:
              type: object
              additionalProperties: false
              required:
              - PENDING
              - ACTIVE
              - DISABLED
              properties:
                PENDING:
                  type: integer
                  format: int64
                  minimum: 0
                ACTIVE:
                  type: integer
                  format: int64
                  minimum: 0
                DISABLED:
                  type: integer
                  format: int64
                  minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
        activeTotal:
          type: integer
          format: int64
          minimum: 0
    BackupRunItem:
      type: object
      additionalProperties: false
      required:
      - scheduledFor
      - state
      - snapshotAt
      - startedAt
      - completedAt
      - byteSize
      - safeError
      - purgedAt
      properties:
        scheduledFor:
          type: string
          format: date
        state:
          type: string
          enum:
          - CREATED
          - RUNNING
          - SUCCESS
          - FAILED
        snapshotAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        startedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Null until the owner U03 exposes start time. Never inferred
            from snapshotAt.
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        byteSize:
          anyOf:
          - type: integer
            format: int64
            minimum: 0
          - type: 'null'
        safeError:
          anyOf:
          - type: string
          - type: 'null'
        purgedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
    BackupSchedule:
      type: object
      additionalProperties: false
      required:
      - enabled
      - dailyAt
      - timeZone
      - nextPlannedAt
      properties:
        enabled:
          type: boolean
        dailyAt:
          anyOf:
          - type: string
          - type: 'null'
        timeZone:
          type: string
          const: Asia/Ho_Chi_Minh
        nextPlannedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Estimate from received settings only; not proof a job is scheduled.
            U03 settings may be cached.
    BackupFailureSummary:
      type: object
      additionalProperties: false
      required:
      - count
      - latestSafeError
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
        latestSafeError:
          anyOf:
          - type: string
          - type: 'null'
    BackupSection:
      type: object
      additionalProperties: false
      required:
      - latest
      - schedule
      - recentRuns
      - latestSuccessfulAt
      - failuresLast7Days
      properties:
        latest:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                anyOf:
                - $ref: '#/components/schemas/BackupRunItem'
                - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
        schedule:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                $ref: '#/components/schemas/BackupSchedule'
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
        recentRuns:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/BackupRunItem'
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
        latestSuccessfulAt:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                type: string
                format: date-time
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
        failuresLast7Days:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                $ref: '#/components/schemas/BackupFailureSummary'
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
      description: 'Current-contract slice: latestSuccessfulAt and failuresLast7Days
        are UNAVAILABLE. AVAILABLE latest with null data means no run yet; UNAVAILABLE
        means unknown.'
    AdminDashboardView:
      type: object
      additionalProperties: false
      required:
      - calculatedAt
      - accounts
      - subjects
      - classes
      - activeEnrollments
      - backup
      properties:
        calculatedAt:
          type: string
          format: date-time
        accounts:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                $ref: '#/components/schemas/AccountCounts'
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
        subjects:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                type: object
                additionalProperties: false
                required:
                - ACTIVE
                - ARCHIVED
                properties:
                  ACTIVE:
                    type: integer
                    format: int64
                    minimum: 0
                  ARCHIVED:
                    type: integer
                    format: int64
                    minimum: 0
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
        classes:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                type: object
                additionalProperties: false
                required:
                - DRAFT
                - OPEN
                - ARCHIVED
                properties:
                  DRAFT:
                    type: integer
                    format: int64
                    minimum: 0
                  OPEN:
                    type: integer
                    format: int64
                    minimum: 0
                  ARCHIVED:
                    type: integer
                    format: int64
                    minimum: 0
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
        activeEnrollments:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: AVAILABLE
              data:
                type: integer
                format: int64
                minimum: 0
          - type: object
            additionalProperties: false
            required:
            - availability
            - data
            properties:
              availability:
                const: UNAVAILABLE
              data:
                type: 'null'
          description: All ACTIVE enrollment relationships, including DRAFT/ARCHIVED
            classes, as defined by U05.
        backup:
          $ref: '#/components/schemas/BackupSection'
    BackupHistoryPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupRunItem'
        page:
          type: integer
          format: int64
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
    ProblemDetail:
      type: object
      required:
      - status
      - detail
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
