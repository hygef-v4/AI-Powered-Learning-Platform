  /api/v1/classes/{classId}/gradebook/export:
    get:
      operationId: exportGradebook
      tags:
      - U09
      description: Assigned Teacher/SubjectManager only. Admin and class-management-only
        authority are denied.
      parameters:
      - name: classId
        in: path
        required: true
        schema: *id001
      - name: assignmentId
        in: query
        required: false
        schema: *id001
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          - xlsx
          default: csv
      security:
      - session: []
      responses:
        '200':
          description: Authorized, no-store streamed export. DRAFT/PENDING score and
            feedback omitted. Text is formula-safe.
          headers:
            Content-Disposition:
              schema: *id010
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '503': *id007
