openapi: 3.1.0
info:
  title: U09 Assignment Grading and Gradebook
  version: 1.0.0
  description: Implementation contract. GRADED assignments only. Server computes decimal
    score from frozen rubric checklist; no client total. Official changes require
    reason and preserve state. AI/MCP only record proposals. Production acceptance
    requires real U07/U08 migrations and provider adapters; see implementation-summary.md.
paths:
  /api/v1/classes/{classId}/assignments/{assignmentId}/submissions:
    get:
      operationId: listGradingSubmissions
      tags:
      - U09
      description: Assigned Teacher/SubjectManager only. Admin and class-management-only
        authority are denied.
      parameters:
      - name: classId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: assignmentId
        in: path
        required: true
        schema: *id001
      - name: page
        in: query
        required: false
        schema: &id008
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - name: size
        in: query
        required: false
        schema: &id009
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - PENDING
          - DRAFT
          - FINALIZED
          - PUBLISHED
          - IN_PROGRESS
          - NOT_SUBMITTED
      - name: late
        in: query
        required: false
        schema:
          type: boolean
      security:
      - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '400': &id002
          description: Invalid request, unknown field, rubric item or source
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id003
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': &id004
          description: CSRF validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404': &id005
          description: Resource absent or actor outside scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': &id006
          description: Version/state/snapshot conflict; reload before retry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503': &id007
          description: Required provider unavailable; do not substitute empty or success
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/classes/{classId}/submission-progress:
    get:
      operationId: getSubmissionProgress
      tags:
      - U09
      description: Assigned Teacher/SubjectManager only. Admin and class-management-only
        authority are denied.
      parameters:
      - name: classId
        in: path
        required: true
        schema: *id001
      security:
      - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/SubmissionPage'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '503': *id007
  /api/v1/classes/{classId}/gradebook:
