components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: access_token
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  schemas:
    Problem:
      type: object
      properties:
        status:
          type: integer
        title: *id010
        detail: *id010
        code: *id010
      required:
      - status
    Person:
      type: object
      properties:
        accountId: *id001
        name: *id010
        email: *id010
      required:
      - accountId
      - name
      - email
    ItemVersion:
      type: object
      properties:
        evaluationId: *id001
        version: &id011
          type: integer
          format: int64
          minimum: 0
      required:
      - evaluationId
      - version
      additionalProperties: false
    Save:
      type: object
      properties:
        version: *id011
        checkedItemsByRubric: &id012
          type: object
          additionalProperties:
            type: array
            items: *id001
        adjustment:
          anyOf:
          - type: number
            multipleOf: 0.01
          - type: string
            pattern: ^-?\d+(\.\d{1,2})?$
          - type: 'null'
        adjustmentReason:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
        feedback:
          anyOf:
          - type: string
            maxLength: 10000
          - type: 'null'
        changeReason:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
        usedProposalId:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - version
      - checkedItemsByRubric
      additionalProperties: false
    MemberSave:
      type: object
      properties:
        version: *id011
        score:
          anyOf:
          - type: number
            multipleOf: 0.01
          - type: string
            pattern: ^-?\d+(\.\d{1,2})?$
        reason:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
      required:
      - version
      - score
      additionalProperties: false
    AiRequest:
      type: object
      properties:
        source:
          type: string
          enum:
          - SHARED
          - PERSONAL
        provider:
          anyOf:
          - type: string
            enum:
            - GEMINI
            - OPENAI
            - CLAUDE
          - type: 'null'
        requestRef:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - source
      - requestRef
      additionalProperties: false
      description: PERSONAL requires provider. Caller chooses source explicitly; no
        fallback. requestRef is idempotent within its evaluation/requester/source/snapshot
        scope.
    Batch:
      type: object
      properties:
        items: &id015
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ItemVersion'
      required:
      - items
      additionalProperties: false
    BatchResult:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              evaluationId: *id001
              outcome: *id010
              code:
                anyOf:
                - *id010
                - type: 'null'
              newVersion:
                anyOf:
                - *id011
                - type: 'null'
            required: &id014 []
      required:
      - items
    AiEstimate:
      type: object
      properties:
        estimatedTokens:
          type: integer
          format: int64
          minimum: 0
        items:
          type: integer
          format: int32
          minimum: 0
      required:
      - estimatedTokens
      - items
      additionalProperties: false
    RubricChecks: *id012
    Evaluation:
      type: object
      properties:
        id: *id001
        assignmentId: *id001
        classId: *id001
        attemptId:
          anyOf:
          - *id001
          - type: 'null'
        groupDocumentId:
          anyOf:
          - *id001
          - type: 'null'
        accountId:
          anyOf:
          - *id001
          - type: 'null'
        kind:
          type: string
          enum:
          - ATTEMPT
          - GROUP_DOCUMENT
          - MEMBER
        state:
          type: string
          enum:
          - PENDING
          - DRAFT
          - FINALIZED
          - PUBLISHED
          - SUPERSEDED
        version: *id011
        score:
          anyOf:
          - &id013
            type: number
            multipleOf: 0.01
          - type: 'null'
        maxScore: *id013
        rubricChecks: *id010
        rubricSnapshot: *id010
        submissionHash: *id010
        adjustment: *id013
        adjustmentReason:
          anyOf:
          - *id010
          - type: 'null'
        feedback:
          anyOf:
          - *id010
          - type: 'null'
        publishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        memberOverride:
          type: boolean
        changes:
          type: array
          items:
            type: object
            properties:
              actorId:
                anyOf:
                - *id001
                - type: 'null'
              at: *id010
              before:
                anyOf:
                - *id013
                - type: 'null'
              after:
                anyOf:
                - *id013
                - type: 'null'
              reason: *id010
              previousChecks: *id010
              previousFeedback:
                anyOf:
                - *id010
                - type: 'null'
            required: *id014
      required: *id014
    Document:
      type: object
      properties:
        blocks:
          type: array
          items:
            type: object
            properties:
              id: *id001
              type:
                type: string
                enum:
                - HEADING
                - PARAGRAPH
                - LIST
                - TABLE
                - IMAGE
                - DIAGRAM
              origin: *id010
              content:
                type: object
            required: *id014
      required:
      - blocks
    Activity:
      type: object
      properties:
        policyState:
          type: string
          enum:
          - DISABLED
          - NO_DATA
          - AVAILABLE
          - EXPIRED
        awayCount:
          type: integer
        knownAwayDuration: *id010
        intervals:
          type: array
          items:
            type: object
        unknownGaps:
          type: integer
        reliabilityNote: *id010
      required: *id014
    Detail:
      type: object
      properties:
        evaluation:
          $ref: '#/components/schemas/Evaluation'
        document:
          $ref: '#/components/schemas/Document'
        rubrics:
          type: array
          items:
            type: object
            description: U07 RubricView contract; frozen submission snapshot
        navigationIds:
          type: array
          items: *id001
        activity:
          anyOf:
          - $ref: '#/components/schemas/Activity'
          - type: 'null'
        activityState: *id010
        members:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
        memberActivities:
          type: array
          items:
            type: object
            properties:
              student:
                $ref: '#/components/schemas/Person'
              activity:
                anyOf:
                - $ref: '#/components/schemas/Activity'
                - type: 'null'
              state: *id010
            required: *id014
        sectionAuthors:
          type: array
          items:
            type: object
            properties:
              partId: *id010
              accountId: *id001
            required: *id014
        current:
          type: boolean
      required: *id014
    SubmissionRow:
      type: object
      properties:
        student:
          $ref: '#/components/schemas/Person'
        evaluationId:
          anyOf:
          - *id001
          - type: 'null'
        attemptId:
          anyOf:
          - *id001
          - type: 'null'
        status: *id010
        score:
          anyOf:
          - *id013
          - type: 'null'
        maxScore:
          anyOf:
          - *id013
          - type: 'null'
        late:
          type: boolean
        submittedAt:
          anyOf:
          - *id010
