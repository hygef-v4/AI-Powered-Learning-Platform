    "title": "U13 Reference Materials",
    "version": "1.1.0",
    "description": "UC58–62. Subject Manager manages assigned subject materials; assigned teacher manages class materials. Students read ACTIVE material of an OPEN enrolled class. Admin denied. Private files use U03 five-minute account-bound tokens. Mutation versions are zero-based optimistic versions; content versionNo starts at one. SUCCESS audit shares the business transaction. Outside scope is 404; no storage fileId or extracted document text appears in web DTOs. AS-BUILT 2026-10-30 at staging@794a4053: material modules owned by U13; source-observed, not runtime acceptance."
  },
